name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev

      - name: Restore raylib source
        id: raylib-cache
        uses: actions/cache@v4
        with:
          path: raylib-src
          key: raylib-5.5

      - name: Download raylib
        if: steps.raylib-cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git raylib-src

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DFETCHCONTENT_SOURCE_DIR_RAYLIB="$GITHUB_WORKSPACE/raylib-src"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
